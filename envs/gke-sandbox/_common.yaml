# ─────────────────────────────────────────────────────────────────────
# gke-sandbox environment — shared values loaded first by every chart.
# StorageClass: standard-rwo (GKE default ReadWriteOnce, Balanced PD).
# ES cluster name: aiops-sandbox
# ─────────────────────────────────────────────────────────────────────

# ECK creates <clusterName>-es-http service + <clusterName>-es-elastic-user secret.
esSecretName: aiops-sandbox-es-elastic-user

elasticsearch:
  hosts: "aiops-sandbox-es-http"

config:
  elasticsearch:
    hosts: "aiops-sandbox-es-http"

# Default storage class for log volumes on every service.
logVolume:
  storageClassName: standard-rwo
