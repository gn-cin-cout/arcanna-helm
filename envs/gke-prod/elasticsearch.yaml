nodeSets:
  - name: default
    count: 1
    config:
      node.store.allow_mmap: false
    javaOpts: "-Xms2g -Xmx2g"
    resources:
      requests:
        memory: "4Gi"
        cpu: "1"
      limits:
        memory: "4Gi"
        cpu: "2"
    storage:
      size: 20Gi
      storageClassName: standard-rwo
